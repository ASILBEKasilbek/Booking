{% extends 'base.html' %}

{% block title %}Navbat bekor qilish{% endblock %}

{% block content %}
<div class="card p-8 max-w-lg mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-gray-800">Navbat bekor qilish</h1>
    <p class="text-gray-600 mb-2"><strong>Tashkilot:</strong> {{ booking.time_slot.organization.name }}</p>
    <p class="text-gray-600 mb-4"><strong>Vaqt:</strong> {{ booking.time_slot.start_time|date:"Y-m-d H:i" }}</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="cancellation_reason" class="block text-sm font-medium text-gray-700">Bekor qilish sababi (ixtiyoriy):</label>
            <textarea name="cancellation_reason" id="cancellation_reason" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" class="btn-danger w-full">Bekor qilish</button>
    </form>
</div>
{% endblock %}
