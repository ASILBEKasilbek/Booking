{% extends 'base.html' %}

{% block title %}Kirish{% endblock %}

{% block content %}
<div class="card p-8 max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-4 text-gray-800">Kirish</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Login:</label>
            <input type="text" name="username" id="username" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Parol:</label>
            <input type="password" name="password" id="password" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500" required>
        </div>
        <button type="submit" class="btn-primary w-full">Kirish</button>
    </form>
</div>
{% endblock %}
