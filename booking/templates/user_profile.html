{% extends 'base.html' %}

{% block title %}Mening profilim{% endblock %}

{% block content %}
<div class="card p-8 max-w-lg mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-gray-800">Mening profilim</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="first_name" class="block text-sm font-medium text-gray-700">Ism:</label>
            <input type="text" name="first_name" id="first_name" value="{{ profile.first_name }}" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="last_name" class="block text-sm font-medium text-gray-700">Familiya:</label>
            <input type="text" name="last_name" id="last_name" value="{{ profile.last_name }}" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="phone_number" class="block text-sm font-medium text-gray-700">Telefon:</label>
            <input type="text" name="phone_number" id="phone_number" value="{{ profile.phone_number }}" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="language_preference" class="block text-sm font-medium text-gray-700">Til:</label>
            <select name="language_preference" id="language_preference" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500">
                <option value="uz" {% if profile.language_preference == 'uz' %}selected{% endif %}>O‘zbek</option>
                <option value="en" {% if profile.language_preference == 'en' %}selected{% endif %}>English</option>
            </select>
        </div>
        <div>
            <label for="timezone" class="block text-sm font-medium text-gray-700">Vaqt zonasi:</label>
            <select name="timezone" id="timezone" class="w-full border rounded-lg p-2 shadow-sm focus:ring-2 focus:ring-blue-500">
                {% for tz in profile.get_timezone_choices %}
                    <option value="{{ tz }}" {% if profile.timezone == tz %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn-primary w-full">Saqlash</button>
    </form>
</div>
{% endblock %}
